<svg viewBox="0 0 860 150" xmlns="http://www.w3.org/2000/svg">
  <g id="call">
    <rect x="20" y="40" width="180" height="64" rx="10" fill="var(--fig-blue-soft)" stroke="var(--fig-blue)"/>
    <text x="36" y="66" fill="var(--fig-ink)" font-weight="600">Call</text>
    <text x="36" y="88" fill="var(--fig-blue)" font-family="monospace" font-size="12">call()</text>
  </g>
  <path d="M200 72h60" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <text x="210" y="62" fill="var(--fig-muted)" font-size="12">fails</text>
  <g id="give-up">
    <rect x="260" y="40" width="200" height="64" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)"/>
    <text x="276" y="66" fill="var(--fig-ink)" font-weight="600">Retries left?</text>
    <text x="276" y="88" fill="var(--fig-muted)" font-size="12">and the error retryable</text>
  </g>
  <path d="M460 72h60" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <text x="472" y="62" fill="var(--fig-muted)" font-size="12">yes</text>
  <g id="wait">
    <rect x="520" y="40" width="200" height="64" rx="10" fill="var(--fig-amber-soft)" stroke="var(--fig-amber)"/>
    <text x="536" y="66" fill="var(--fig-ink)" font-weight="600">Wait</text>
    <text x="536" y="88" fill="var(--fig-amber)" font-family="monospace" font-size="12">100, 200, 400 ms</text>
  </g>
  <path d="M620 104v26H110v-26" stroke="var(--fig-muted)" stroke-width="1.5" fill="none"/>
  <text x="330" y="146" fill="var(--fig-muted)" font-size="12">then call again</text>
  <path d="M360 40V16h420v24" stroke="var(--fig-muted)" stroke-width="1.5" fill="none"/>
  <text x="560" y="12" fill="var(--fig-muted)" font-size="12">no</text>
  <g id="thrown">
    <rect x="740" y="40" width="100" height="64" rx="10" fill="var(--fig-red-soft)" stroke="var(--fig-red)"/>
    <text x="756" y="76" fill="var(--fig-ink)" font-weight="600">Thrown</text>
  </g>
</svg>
