<svg viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg">
  <g id="request">
    <rect x="10" y="104" width="120" height="56" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)"/>
    <text x="24" y="128" fill="var(--fig-ink)" font-weight="600">Request</text>
    <text x="24" y="148" fill="var(--fig-muted)" font-family="monospace" font-size="12">take(tenant)</text>
  </g>
  <path d="M130 132H162" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M170 132l-8-4v8z" fill="var(--fig-muted)"/>

  <g id="take">
    <rect x="170" y="96" width="190" height="72" rx="10" fill="var(--fig-blue-soft)" stroke="var(--fig-blue)"/>
    <text x="184" y="122" fill="var(--fig-blue)" font-family="monospace" font-weight="600">Limiter.take</text>
    <text x="184" y="142" fill="var(--fig-ink)" font-size="13">A token free, and</text>
    <text x="184" y="159" fill="var(--fig-ink)" font-size="13">nobody waiting?</text>
  </g>

  <path d="M360 116C470 116 540 52 652 52" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M660 52l-8-4v8z" fill="var(--fig-muted)"/>
  <text x="488" y="74" fill="var(--fig-muted)" font-size="12">yes</text>

  <path d="M360 152C390 152 390 182 412 182" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M420 182l-8-4v8z" fill="var(--fig-muted)"/>
  <text x="376" y="200" fill="var(--fig-muted)" font-size="12">no</text>

  <g id="waiters">
    <rect x="420" y="150" width="180" height="64" rx="10" fill="var(--fig-amber-soft)" stroke="var(--fig-amber)"/>
    <text x="434" y="174" fill="var(--fig-ink)" font-weight="600">Waiters</text>
    <text x="434" y="196" fill="var(--fig-amber)" font-family="monospace" font-size="12">oldest first</text>
  </g>

  <path d="M560 150C560 90 600 66 652 66" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M660 66l-8-4v8z" fill="var(--fig-muted)"/>
  <g id="wake">
    <text x="604" y="118" fill="var(--fig-blue)" font-size="12" font-weight="600">wake timer</text>
    <text x="604" y="134" fill="var(--fig-muted)" font-size="12">a token refills</text>
  </g>

  <path d="M600 200C625 200 630 224 652 224" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M660 224l-8-4v8z" fill="var(--fig-muted)"/>
  <text id="timeout" x="648" y="252" fill="var(--fig-muted)" font-family="monospace" font-size="12" text-anchor="end">timeoutMs</text>

  <path d="M265 168V266H760V264" fill="none" stroke="var(--fig-muted)" stroke-width="1.5"/>
  <path d="M760 256l-4 8h8z" fill="var(--fig-muted)"/>
  <text id="full" x="280" y="258" fill="var(--fig-muted)" font-family="monospace" font-size="12">maxWaiting already waiting</text>

  <g id="goes">
    <rect x="660" y="24" width="190" height="56" rx="10" fill="var(--fig-green-soft)" stroke="var(--fig-green)"/>
    <text x="674" y="48" fill="var(--fig-green)" font-weight="600">Goes on</text>
    <text x="674" y="68" fill="var(--fig-ink)" font-size="12">with a token</text>
  </g>

  <g id="fails">
    <rect x="660" y="200" width="190" height="56" rx="10" fill="var(--fig-red-soft)" stroke="var(--fig-red)"/>
    <text x="674" y="224" fill="var(--fig-red)" font-family="monospace" font-weight="600">LimitError</text>
    <text x="674" y="244" fill="var(--fig-ink)" font-size="12">fails, as before</text>
  </g>
</svg>
