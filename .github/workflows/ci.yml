# The `ci` check that fixtures E4 and E5 need (script/e2e/fixtures.sh in scornz/lo). Its result
# comes from the `ci-result` files a change adds or changes: `pass`, `fail`, `slow` (passes after
# 10 minutes), `flaky` (fails on a run's first attempt, and passes when run again) or
# `fail-in-queue` (fails only in the merge queue). With several, as in a merge group, the worst
# wins, and with none it passes. It runs for pull requests into e4/ branches and their merge queue.
name: ci

on:
  pull_request:
    branches: ['e4/*']
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pass, fail or wait, as the change's ci-result files say
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case $EVENT in
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            merge_group) base=$GROUP_BASE head=$GROUP_HEAD ;;
            *)
              echo "::error::ci doesn't run on $EVENT."
              exit 1
              ;;
          esac
          result=pass
          while IFS= read -r file; do
            case $file in
              ci-result | */ci-result) ;;
              *) continue ;;
            esac
            git cat-file -e "$head:$file" 2>/dev/null || continue
            said=$(git show "$head:$file" | sed -n 1p)
            echo "$file says $said."
            case $said in
              pass) ;;
              fail) result=fail ;;
              slow) if [[ $result == pass ]]; then result=slow; fi ;;
              flaky)
                if ((GITHUB_RUN_ATTEMPT == 1)); then
                  result=fail
                else
                  echo "This is attempt $GITHUB_RUN_ATTEMPT, so $file passes."
                fi
                ;;
              fail-in-queue)
                if [[ $EVENT == merge_group ]]; then
                  result=fail
                else
                  echo "This isn't the merge queue, so $file passes."
                fi
                ;;
              *)
                echo "::error file=$file::A ci-result file says pass, fail, slow, flaky or fail-in-queue, not '$said'."
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$base...$head")
          case $result in
            pass) echo "ci passes." ;;
            fail)
              echo "::error::ci fails, as a ci-result file asks."
              exit 1
              ;;
            slow)
              echo "ci passes in 10 minutes."
              sleep 600
              ;;
          esac
